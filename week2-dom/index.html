<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mama Mboga Fresh: order</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <h1 id="shop-name">Mama Mboga Fresh</h1>
    <p class="tagline">Fresh vegetables from Kangemi market</p>
    <p id="status" class="status">Loading...</p>

    <section class="card" id="product">
      <h2 class="product-name">Tomatoes</h2>
      <p>KSh <span class="price">120</span> per kg</p>
      <img src="images/tomato.jpg" alt="Ripe red tomatoes"
           id="product-image">
    </section>

    <section class="card">
      <h2>Your basket</h2>
      <ul id="basket"></ul>
      <p class="total">Total: <strong id="total">KSh 0.00</strong></p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
