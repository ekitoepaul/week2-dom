<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f5f9" />
    <title>Kazi List</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
  </head>

  <body>
    <main class="card">
      <header class="card-header">
        <div class="header-main">
          <h1>Kazi List</h1>
          <p id="greeting" class="greeting" hidden></p>
          <p id="task-count" class="task-count" aria-live="polite"></p>
        </div>

        <div class="clock" aria-label="Current date and time">
          <p id="today-date" class="today-date"></p>
          <p id="live-clock" class="live-clock"></p>
        </div>
      </header>

      <form id="name-form" class="name-form">
        <label for="user-name">What is your name?</label>
        <div class="name-form-controls">
          <input
            type="text"
            id="user-name"
            maxlength="40"
            autocomplete="given-name"
            required
          />
          <button type="submit">Save name</button>
        </div>
      </form>

      <section class="task-tools" aria-label="Find and filter tasks">
        <label for="search-input">Search tasks</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search by task name… (press /)"
          autocomplete="off"
        />

        <div class="filter-heading">
          <span>Filter tasks</span>
          <span class="filter-hint">Choose a view</span>
        </div>
        <div
          id="filter-buttons"
          class="filter-buttons"
          aria-label="Task filters"
        >
          <button
            type="button"
            class="filter-btn"
            data-filter="all"
            aria-pressed="true"
          >
            All
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="open"
            aria-pressed="false"
          >
            To do
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="done"
            aria-pressed="false"
          >
            Completed
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="overdue"
            aria-pressed="false"
          >
            Overdue
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="today"
            aria-pressed="false"
          >
            Due today
          </button>
          <button
            type="button"
            class="filter-btn"
            data-filter="week"
            aria-pressed="false"
          >
            Due this week
          </button>
        </div>
      </section>

      <ul id="task-list" class="task-list" aria-label="Your tasks"></ul>

      <p id="task-summary" class="task-summary" aria-live="polite"></p>

      <div class="list-actions">
        <button type="button" id="mark-all-done">Mark all done</button>
        <button type="button" id="clear-done">Clear completed</button>
        <button type="button" id="delete-all" class="danger-button">
          Delete all tasks
        </button>
        <button type="button" id="export-tasks">Export</button>
      </div>

      <pre id="export-output" class="export-output" hidden></pre>
    </main>

    <section class="add-card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a task</h2>
      <form id="add-form">
        <label for="new-title">New task</label>
        <input
          type="text"
          id="new-title"
          maxlength="80"
          autocomplete="off"
          required
        />

        <div class="form-row">
          <div>
            <label for="new-priority">Priority</label>
            <select id="new-priority">
              <option value="normal">Normal</option>
              <option value="high">High</option>
            </select>
          </div>
          <div>
            <label for="new-due">Due date (optional)</label>
            <input type="date" id="new-due" />
          </div>
        </div>

        <button type="submit" class="primary-button">Add task</button>
        <p id="add-error" class="error" aria-live="polite"></p>
      </form>
    </section>

    <p id="status" class="status-message" role="status" aria-live="polite"></p>

    <template id="task-template">
      <li class="task">
        <label class="task-label">
          <input class="task-check" type="checkbox" />
          <span class="task-title"></span>
        </label>

        <button class="badge" type="button"></button>
        <time class="due"></time>
        <span class="created"></span>

        <div class="task-actions">
          <button class="details-btn" type="button">Details</button>
          <button class="edit-btn" type="button">Edit</button>
          <button class="delete-btn" type="button">Delete</button>
        </div>
      </li>
    </template>
  </body>
</html>
