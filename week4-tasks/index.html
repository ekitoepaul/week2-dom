<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kazi List</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="card">
      <header class="card-header">
        <h1>Kazi List</h1>

        <p id="greeting" class="greeting" hidden></p>
        <p id="task-count" class="task-count"></p>
      </header>

      <form id="name-form" class="name-form">
        <label for="user-name">What is your name?</label>
        <input
          type="text"
          id="user-name"
          maxlength="40"
          autocomplete="given-name"
          required
        />

        <button type="submit">Save name</button>
      </form>

      <ul id="task-list" class="task-list"></ul>

      <div class="list-actions">
        <button type="button" id="mark-all-done">Mark all done</button>
        <button type="button" id="clear-done">Clear completed</button>
        <button type="button" id="delete-all">Delete all tasks</button>
        <button type="button" id="export-tasks">Export</button>
      </div>

      <pre id="export-output" class="export-output" hidden></pre>
    </main>

    <form id="add-form">
      <label for="new-title">New task</label>
      <input type="text" id="new-title" maxlength="80" autocomplete="off" />

      <label for="new-priority">Priority</label>
      <select id="new-priority">
        <option value="normal">Normal</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Add task</button>

      <p id="add-error" class="error" aria-live="polite"></p>
    </form>

    <p id="status" aria-live="polite"></p>

    <template id="task-template">
      <li class="task">
        <label class="task-label">
          <input class="task-check" type="checkbox" />
          <span class="task-title"></span>
        </label>

        <button class="badge" type="button"></button>

        <div class="task-actions">
          <button class="details-btn" type="button">Details</button>
          <button class="edit-btn" type="button">Edit</button>
          <button class="delete-btn" type="button">Delete</button>
        </div>
      </li>
    </template>

    <script src="js/app.js"></script>
  </body>
</html>
